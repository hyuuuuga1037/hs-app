<title>旅行割り勘帳</title>
<style>
  :root {
    --bg: #F1F3F0;
    --surface: #FFFFFF;
    --surface-sunk: #E9ECE8;
    --ink: #17262A;
    --ink-soft: #55696C;
    --ink-faint: #8B9C9C;
    --accent: #1F7A6C;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEEE8;
    --accent-soft-ink: #14554A;
    --warn: #B96A20;
    --warn-soft: #F5E3CC;
    --warn-soft-ink: #7A4713;
    --line: rgba(23, 38, 42, 0.13);
    --line-strong: rgba(23, 38, 42, 0.24);
    --shadow: 0 1px 2px rgba(23,38,42,0.06), 0 6px 20px -8px rgba(23,38,42,0.18);
    --radius: 14px;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181A;
      --surface: #182325;
      --surface-sunk: #0D1517;
      --ink: #E9EFEE;
      --ink-soft: #9FB3B1;
      --ink-faint: #5E7472;
      --accent: #4FBFA8;
      --accent-ink: #08201B;
      --accent-soft: #1D3733;
      --accent-soft-ink: #9CE6D4;
      --warn: #E2A15C;
      --warn-soft: #3B2C1A;
      --warn-soft-ink: #F0C593;
      --line: rgba(233, 239, 238, 0.14);
      --line-strong: rgba(233, 239, 238, 0.26);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181A;
    --surface: #182325;
    --surface-sunk: #0D1517;
    --ink: #E9EFEE;
    --ink-soft: #9FB3B1;
    --ink-faint: #5E7472;
    --accent: #4FBFA8;
    --accent-ink: #08201B;
    --accent-soft: #1D3733;
    --accent-soft-ink: #9CE6D4;
    --warn: #E2A15C;
    --warn-soft: #3B2C1A;
    --warn-soft-ink: #F0C593;
    --line: rgba(233, 239, 238, 0.14);
    --line-strong: rgba(233, 239, 238, 0.26);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 96px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  header.top h1 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }
  header.top .trip-sub {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  button.reset-link {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 4px 0;
    font-family: var(--sans);
  }
  button.reset-link:hover { color: var(--ink-soft); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
  }
  .card h2 .n {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  /* Members */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 14px;
    font-size: 13.5px;
    color: var(--ink);
  }
  .chip button {
    all: unset;
    cursor: pointer;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1;
  }
  .chip button:hover { background: var(--line); color: var(--ink); }
  .chip button:focus-visible, .add-member button:focus-visible, input:focus-visible, select:focus-visible, .stepper button:focus-visible, .payer-pick button:focus-visible, .quick button:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .add-member { display: flex; gap: 8px; }
  .add-member input {
    flex: 1;
    min-width: 0;
  }

  input[type="text"], input[type="number"], input[type="date"], select {
    font-family: var(--sans);
    font-size: 14.5px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    width: 100%;
  }
  label.field {
    display: block;
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .field-block { margin-bottom: 12px; }

  .btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    border-radius: 9px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
  .btn-ghost:hover { background: var(--surface-sunk); }
  .btn-block { width: 100%; }

  /* Payer picker */
  .payer-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .payer-pick button {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-sunk);
    color: var(--ink);
    cursor: pointer;
  }
  .payer-pick button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* Share weighting */
  .share-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .share-row:last-child { border-bottom: none; }
  .share-name { font-size: 13.5px; }
  .share-name .tag {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--warn-soft-ink);
    background: var(--warn-soft);
    border-radius: 999px;
    padding: 1px 7px;
    vertical-align: 1px;
  }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--line-strong);
    background: var(--surface-sunk);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .stepper button:hover { background: var(--line); }
  .stepper .wt {
    width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .share-amt {
    font-variant-numeric: tabular-nums;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    min-width: 64px;
    text-align: right;
  }
  .quick { display: flex; gap: 6px; margin: 10px 0 4px; }
  .quick button {
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .quick button:hover { background: var(--surface-sunk); color: var(--ink-soft); }

  /* Ledger list */
  .ledger-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
  }
  .ledger-item:last-child { border-bottom: none; }
  .ledger-date {
    font-family: var(--serif);
    font-size: 11.5px;
    color: var(--ink-faint);
    width: 42px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .ledger-main { flex: 1; min-width: 0; }
  .ledger-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ledger-desc { font-size: 14.5px; color: var(--ink); }
  .ledger-amt { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .ledger-meta { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
  .ledger-meta .adj { color: var(--warn-soft-ink); background: var(--warn-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: 10.5px; letter-spacing: 0.03em; }
  .ledger-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    all: unset;
    cursor: pointer;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 7px;
    color: var(--ink-faint);
    font-size: 13px;
  }
  .icon-btn:hover { background: var(--surface-sunk); color: var(--ink); }
  .empty-note {
    color: var(--ink-faint);
    font-size: 13px;
    text-align: center;
    padding: 18px 0;
  }

  /* Settlement */
  .balance-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .balance-pill {
    flex: 1;
    min-width: 110px;
    background: var(--surface-sunk);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
  }
  .balance-pill .name { font-size: 12.5px; color: var(--ink-soft); }
  .balance-pill .amt { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; margin-top: 2px; }
  .balance-pill.plus .amt { color: var(--accent-soft-ink); }
  .balance-pill.minus .amt { color: var(--warn-soft-ink); }
  .balance-pill .status {
    display: inline-block; margin-top: 4px;
    font-size: 10px; letter-spacing: 0.04em;
    border-radius: 999px; padding: 2px 8px;
  }
  .balance-pill.plus .status { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .balance-pill.minus .status { background: var(--warn-soft); color: var(--warn-soft-ink); }
  .balance-pill.zero .status { background: var(--surface); color: var(--ink-faint); border: 1px solid var(--line); }

  .settle-list { display: flex; flex-direction: column; gap: 8px; }
  .settle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .settle-row .who { font-size: 14px; color: var(--accent-soft-ink); font-weight: 600; flex: 1; }
  .settle-row .arrow { color: var(--accent-soft-ink); opacity: 0.6; }
  .settle-row .amt {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 15.5px;
    color: var(--accent-soft-ink);
  }
  .settle-done {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13.5px;
    padding: 10px 0;
  }

  footer.foot {
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 24px;
    letter-spacing: 0.03em;
  }

  @media (max-width: 380px) {
    .row2 { grid-template-columns: 1fr; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>旅行割り勘帳</h1>
      <div class="trip-sub" id="tripSub">立替を記録して、最後にまとめて精算</div>
    </div>
    <button class="reset-link" id="resetBtn" type="button">全部リセット</button>
  </header>

  <section class="card" id="membersCard">
    <h2>メンバー <span class="n" id="memberCount"></span></h2>
    <div class="chips" id="memberChips"></div>
    <div class="add-member">
      <input type="text" id="newMemberInput" placeholder="名前を入力して追加" maxlength="12" />
      <button class="btn btn-accent" id="addMemberBtn" type="button">追加</button>
    </div>
  </section>

  <section class="card" id="addCard">
    <h2>立替を記録</h2>
    <div class="row2">
      <div>
        <label class="field">日付</label>
        <input type="date" id="expDate" />
      </div>
      <div>
        <label class="field">金額（円）</label>
        <input type="number" id="expAmount" inputmode="numeric" min="0" placeholder="0" />
      </div>
    </div>
    <div class="field-block">
      <label class="field">内容</label>
      <input type="text" id="expDesc" placeholder="例）ガソリン代、宿代、夕食" maxlength="40" />
    </div>
    <div class="field-block">
      <label class="field">立替えた人</label>
      <div class="payer-pick" id="payerPick"></div>
    </div>
    <div class="field-block">
      <label class="field">負担割合（運転者を軽くする、不参加を外す、など調整可）</label>
      <div class="quick">
        <button type="button" data-quick="equal">全員均等</button>
        <button type="button" data-quick="halfPayer">立替者を軽く(0.5)</button>
      </div>
      <div id="shareRows"></div>
    </div>
    <button class="btn btn-accent btn-block" id="addExpenseBtn" type="button">この立替を追加</button>
  </section>

  <section class="card" id="ledgerCard">
    <h2>記録一覧 <span class="n" id="ledgerCount"></span></h2>
    <div id="ledgerList"></div>
  </section>

  <section class="card" id="settleCard">
    <h2>精算サマリー</h2>
    <div class="balance-grid" id="balanceGrid"></div>
    <div class="settle-list" id="settleList"></div>
  </section>

  <footer class="foot">データはこの端末のブラウザ内にのみ保存されます</footer>
</div>

<script>
(function () {
  var STORAGE_KEY = "warikan_trip_v1";

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      members: [
        { id: uid(), name: "" }
      ].filter(function (m) { return m.name; }),
      expenses: [],
      draftShares: {}
    };
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadState();
  if (!state.members) state.members = [];
  if (!state.expenses) state.expenses = [];

  var selectedPayer = state.members.length ? state.members[0].id : null;
  var editingId = null; // expense id currently being edited, or null for "new"
  var draftWeights = {}; // memberId -> weight, for the add/edit form in progress

  function fmtYen(n) {
    var r = Math.round(n);
    return "¥" + r.toLocaleString("ja-JP");
  }

  function memberName(id) {
    var m = state.members.find(function (x) { return x.id === id; });
    return m ? m.name : "(削除済み)";
  }

  function resetDraftWeights() {
    draftWeights = {};
    state.members.forEach(function (m) { draftWeights[m.id] = 1; });
  }

  // ---------- Members ----------
  function renderMembers() {
    var chipsEl = document.getElementById("memberChips");
    chipsEl.innerHTML = "";
    state.members.forEach(function (m) {
      var chip = document.createElement("span");
      chip.className = "chip";
      var nameSpan = document.createElement("span");
      nameSpan.textContent = m.name;
      chip.appendChild(nameSpan);
      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.setAttribute("aria-label", m.name + "を削除");
      removeBtn.textContent = "×";
      removeBtn.addEventListener("click", function () { removeMember(m.id); });
      chip.appendChild(removeBtn);
      chipsEl.appendChild(chip);
    });
    document.getElementById("memberCount").textContent = state.members.length ? state.members.length + "人" : "";
  }

  function addMember(name) {
    name = name.trim();
    if (!name) return;
    var m = { id: uid(), name: name };
    state.members.push(m);
    if (draftWeights) draftWeights[m.id] = 1;
    if (!selectedPayer) selectedPayer = m.id;
    saveState();
    renderAll();
  }

  function removeMember(id) {
    var used = state.expenses.some(function (e) {
      return e.payerId === id || Object.prototype.hasOwnProperty.call(e.shares, id);
    });
    if (used) {
      alert(memberName(id) + " は記録済みの立替に関わっているため削除できません。先にその記録を削除してください。");
      return;
    }
    state.members = state.members.filter(function (m) { return m.id !== id; });
    delete draftWeights[id];
    if (selectedPayer === id) selectedPayer = state.members.length ? state.members[0].id : null;
    saveState();
    renderAll();
  }

  // ---------- Add expense form ----------
  function renderPayerPick() {
    var el = document.getElementById("payerPick");
    el.innerHTML = "";
    if (!state.members.length) {
      el.innerHTML = '<span class="empty-note" style="padding:0;">先にメンバーを追加してください</span>';
      return;
    }
    state.members.forEach(function (m) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = m.name;
      b.setAttribute("aria-pressed", String(selectedPayer === m.id));
      b.addEventListener("click", function () {
        selectedPayer = m.id;
        renderPayerPick();
      });
      el.appendChild(b);
    });
  }

  function renderShareRows() {
    var el = document.getElementById("shareRows");
    el.innerHTML = "";
    var amount = parseFloat(document.getElementById("expAmount").value) || 0;
    var totalWeight = state.members.reduce(function (s, m) { return s + (draftWeights[m.id] || 0); }, 0);

    state.members.forEach(function (m) {
      var w = draftWeights[m.id] != null ? draftWeights[m.id] : 1;
      var row = document.createElement("div");
      row.className = "share-row";

      var nameEl = document.createElement("div");
      nameEl.className = "share-name";
      nameEl.textContent = m.name;
      if (w === 0) {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "対象外";
        nameEl.appendChild(tag);
      } else if (w !== 1) {
        var tag2 = document.createElement("span");
        tag2.className = "tag";
        tag2.textContent = "調整 ×" + w;
        nameEl.appendChild(tag2);
      }
      row.appendChild(nameEl);

      var stepper = document.createElement("div");
      stepper.className = "stepper";
      var minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      minus.setAttribute("aria-label", m.name + "の割合を減らす");
      minus.addEventListener("click", function () {
        draftWeights[m.id] = Math.max(0, Math.round((w - 0.25) * 100) / 100);
        renderShareRows();
      });
      var wtLabel = document.createElement("span");
      wtLabel.className = "wt";
      wtLabel.textContent = "×" + w;
      var plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", m.name + "の割合を増やす");
      plus.addEventListener("click", function () {
        draftWeights[m.id] = Math.round((w + 0.25) * 100) / 100;
        renderShareRows();
      });
      stepper.appendChild(minus);
      stepper.appendChild(wtLabel);
      stepper.appendChild(plus);
      row.appendChild(stepper);

      var amtEl = document.createElement("div");
      amtEl.className = "share-amt";
      var share = totalWeight > 0 ? (amount * w / totalWeight) : 0;
      amtEl.textContent = w > 0 ? fmtYen(share) : "–";
      row.appendChild(amtEl);

      el.appendChild(row);
    });
  }

  function clearAddForm() {
    editingId = null;
    document.getElementById("expDate").value = todayStr();
    document.getElementById("expAmount").value = "";
    document.getElementById("expDesc").value = "";
    resetDraftWeights();
    selectedPayer = state.members.length ? state.members[0].id : null;
    document.getElementById("addExpenseBtn").textContent = "この立替を追加";
    renderPayerPick();
    renderShareRows();
  }

  function addOrUpdateExpense() {
    if (!state.members.length) { alert("先にメンバーを追加してください"); return; }
    var amount = parseFloat(document.getElementById("expAmount").value);
    var desc = document.getElementById("expDesc").value.trim();
    var date = document.getElementById("expDate").value || todayStr();
    if (!amount || amount <= 0) { alert("金額を入力してください"); return; }
    if (!desc) { desc = "（内容未入力）"; }
    if (!selectedPayer) { alert("立替えた人を選んでください"); return; }
    var totalWeight = state.members.reduce(function (s, m) { return s + (draftWeights[m.id] || 0); }, 0);
    if (totalWeight <= 0) { alert("少なくとも1人は負担割合を0より大きくしてください"); return; }

    var shares = {};
    state.members.forEach(function (m) {
      var w = draftWeights[m.id] || 0;
      if (w > 0) shares[m.id] = w;
    });

    if (editingId) {
      var idx = state.expenses.findIndex(function (e) { return e.id === editingId; });
      if (idx > -1) {
        state.expenses[idx] = { id: editingId, date: date, desc: desc, amount: amount, payerId: selectedPayer, shares: shares };
      }
    } else {
      state.expenses.push({ id: uid(), date: date, desc: desc, amount: amount, payerId: selectedPayer, shares: shares });
    }
    saveState();
    clearAddForm();
    renderAll();
  }

  function startEdit(id) {
    var e = state.expenses.find(function (x) { return x.id === id; });
    if (!e) return;
    editingId = id;
    document.getElementById("expDate").value = e.date;
    document.getElementById("expAmount").value = e.amount;
    document.getElementById("expDesc").value = e.desc;
    selectedPayer = e.payerId;
    resetDraftWeights();
    Object.keys(e.shares).forEach(function (mid) { draftWeights[mid] = e.shares[mid]; });
    document.getElementById("addExpenseBtn").textContent = "変更を保存";
    renderPayerPick();
    renderShareRows();
    document.getElementById("addCard").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function deleteExpense(id) {
    if (!confirm("この記録を削除しますか？")) return;
    state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
    if (editingId === id) clearAddForm();
    saveState();
    renderAll();
  }

  // ---------- Ledger list ----------
  function renderLedger() {
    var el = document.getElementById("ledgerList");
    document.getElementById("ledgerCount").textContent = state.expenses.length ? state.expenses.length + "件" : "";
    if (!state.expenses.length) {
      el.innerHTML = '<div class="empty-note">まだ記録がありません。上のフォームから追加してください。</div>';
      return;
    }
    var sorted = state.expenses.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    el.innerHTML = "";
    sorted.forEach(function (e) {
      var everyoneIncluded = state.members.every(function (m) { return e.shares[m.id] != null; });
      var uniqueWeights = Array.from(new Set(Object.values(e.shares)));
      var isAdjusted = !everyoneIncluded || uniqueWeights.length > 1 || uniqueWeights[0] !== 1;

      var item = document.createElement("div");
      item.className = "ledger-item";

      var dateEl = document.createElement("div");
      dateEl.className = "ledger-date";
      var d = new Date(e.date + "T00:00:00");
      dateEl.textContent = isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate();
      item.appendChild(dateEl);

      var main = document.createElement("div");
      main.className = "ledger-main";
      var top = document.createElement("div");
      top.className = "ledger-top";
      var descEl = document.createElement("div");
      descEl.className = "ledger-desc";
      descEl.textContent = e.desc;
      var amtEl = document.createElement("div");
      amtEl.className = "ledger-amt";
      amtEl.textContent = fmtYen(e.amount);
      top.appendChild(descEl);
      top.appendChild(amtEl);
      main.appendChild(top);

      var meta = document.createElement("div");
      meta.className = "ledger-meta";
      meta.textContent = "立替: " + memberName(e.payerId);
      if (isAdjusted) {
        var adjSpan = document.createElement("span");
        adjSpan.className = "adj";
        adjSpan.textContent = "割合調整あり";
        meta.appendChild(adjSpan);
      }
      main.appendChild(meta);
      item.appendChild(main);

      var actions = document.createElement("div");
      actions.className = "ledger-actions";
      var editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.setAttribute("aria-label", "編集");
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", function () { startEdit(e.id); });
      var delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.setAttribute("aria-label", "削除");
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", function () { deleteExpense(e.id); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      item.appendChild(actions);

      el.appendChild(item);
    });
  }

  // ---------- Settlement ----------
  function computeBalances() {
    var balance = {};
    state.members.forEach(function (m) { balance[m.id] = 0; });
    state.expenses.forEach(function (e) {
      var totalWeight = Object.values(e.shares).reduce(function (s, w) { return s + w; }, 0);
      if (totalWeight <= 0) return;
      if (balance[e.payerId] == null) balance[e.payerId] = 0;
      balance[e.payerId] += e.amount;
      Object.keys(e.shares).forEach(function (mid) {
        if (balance[mid] == null) balance[mid] = 0;
        balance[mid] -= e.amount * e.shares[mid] / totalWeight;
      });
    });
    return balance;
  }

  function computeSettlement(balance) {
    var creditors = [];
    var debtors = [];
    Object.keys(balance).forEach(function (id) {
      var v = Math.round(balance[id]);
      if (v > 0) creditors.push({ id: id, amt: v });
      else if (v < 0) debtors.push({ id: id, amt: -v });
    });
    creditors.sort(function (a, b) { return b.amt - a.amt; });
    debtors.sort(function (a, b) { return b.amt - a.amt; });

    var txns = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      var c = creditors[ci], d = debtors[di];
      var pay = Math.min(c.amt, d.amt);
      if (pay > 0) txns.push({ from: d.id, to: c.id, amount: pay });
      c.amt -= pay; d.amt -= pay;
      if (c.amt <= 0) ci++;
      if (d.amt <= 0) di++;
    }
    return txns;
  }

  function renderSettlement() {
    var balance = computeBalances();
    var gridEl = document.getElementById("balanceGrid");
    gridEl.innerHTML = "";
    state.members.forEach(function (m) {
      var v = Math.round(balance[m.id] || 0);
      var pill = document.createElement("div");
      pill.className = "balance-pill " + (v > 0 ? "plus" : v < 0 ? "minus" : "zero");
      var nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = m.name;
      var amtEl = document.createElement("div");
      amtEl.className = "amt";
      amtEl.textContent = fmtYen(Math.abs(v));
      var status = document.createElement("span");
      status.className = "status";
      status.textContent = v > 0 ? "受取り" : v < 0 ? "支払い" : "精算済み";
      pill.appendChild(nameEl);
      pill.appendChild(amtEl);
      pill.appendChild(status);
      gridEl.appendChild(pill);
    });

    var txns = computeSettlement(balance);
    var listEl = document.getElementById("settleList");
    listEl.innerHTML = "";
    if (!state.expenses.length) {
      listEl.innerHTML = '<div class="empty-note">記録を追加すると精算方法が表示されます</div>';
      return;
    }
    if (!txns.length) {
      listEl.innerHTML = '<div class="settle-done">全員の精算が完了しています ✓</div>';
      return;
    }
    txns.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "settle-row";
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = memberName(t.from) + " → " + memberName(t.to);
      var amt = document.createElement("div");
      amt.className = "amt";
      amt.textContent = fmtYen(t.amount);
      row.appendChild(who);
      row.appendChild(amt);
      listEl.appendChild(row);
    });
  }

  function renderAll() {
    renderMembers();
    renderPayerPick();
    renderShareRows();
    renderLedger();
    renderSettlement();
  }

  // ---------- Wire up ----------
  document.getElementById("addMemberBtn").addEventListener("click", function () {
    var input = document.getElementById("newMemberInput");
    addMember(input.value);
    input.value = "";
    input.focus();
  });
  document.getElementById("newMemberInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("addMemberBtn").click();
  });
  document.getElementById("expAmount").addEventListener("input", renderShareRows);
  document.getElementById("addExpenseBtn").addEventListener("click", addOrUpdateExpense);
  document.querySelectorAll(".quick button").forEach(function (b) {
    b.addEventListener("click", function () {
      var mode = b.getAttribute("data-quick");
      if (mode === "equal") {
        state.members.forEach(function (m) { draftWeights[m.id] = 1; });
      } else if (mode === "halfPayer") {
        state.members.forEach(function (m) { draftWeights[m.id] = (m.id === selectedPayer) ? 0.5 : 1; });
      }
      renderShareRows();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("メンバーと記録をすべて削除して最初からやり直しますか？")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = { members: [], expenses: [] };
    selectedPayer = null;
    clearAddForm();
    renderAll();
  });

  document.getElementById("expDate").value = todayStr();
  resetDraftWeights();
  renderAll();
})();
</script>
